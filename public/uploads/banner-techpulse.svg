<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="glowTp" cx="60%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGradTp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadowTp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bgTp)" />
  <rect width="800" height="420" fill="url(#glowTp)" />

  <!-- Subtle Blueprint Circuit Grid -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="800" y2="70" />
    <line x1="0" y1="140" x2="800" y2="140" />
    <line x1="0" y1="210" x2="800" y2="210" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="160" y1="0" x2="160" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="640" y1="0" x2="640" y2="420" />
  </g>

  <!-- Top Window Header Mock -->
  <rect x="40" y="24" width="720" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
  <circle cx="62" cy="42" r="5" fill="#ef4444" />
  <circle cx="78" cy="42" r="5" fill="#f59e0b" />
  <circle cx="94" cy="42" r="5" fill="#10b981" />
  <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">gadget_passport.php — ITAM Lifecycle &amp; WDV Depreciation Engine</text>

  <!-- Live Platform Pill Badge -->
  <rect x="560" y="30" width="188" height="24" rx="12" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.6)" />
  <circle cx="575" cy="42" r="4" fill="#10b981" />
  <text x="586" y="46" font-family="-apple-system, sans-serif" font-size="10.5" fill="#34d399" font-weight="700">● LIVE WORKING APP</text>

  <!-- Main Hero Card -->
  <g filter="url(#shadowTp)">
    <rect x="50" y="80" width="700" height="290" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.2" />
    <rect x="50" y="80" width="700" height="2" fill="url(#textGradTp)" />
  </g>

  <!-- Brand Identity -->
  <g transform="translate(85, 115)">
    <!-- Circuit / Shield Icon -->
    <rect x="0" y="0" width="60" height="60" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
    <path d="M30 14 L48 22 V34 C48 44 30 50 30 50 C30 50 12 44 12 34 V22 Z" fill="none" stroke="#34d399" stroke-width="2.2" />
    <path d="M24 32 L28 36 L37 27" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Title and Subtitle -->
    <text x="76" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="url(#textGradTp)" letter-spacing="-0.5">HP TechPulse</text>
    <text x="76" y="52" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Enterprise IT Asset Lifecycle &amp; Gadget Health Intelligence</text>
  </g>

  <!-- Key Metrics Grid -->
  <g transform="translate(85, 205)">
    <!-- Metric 1: Health Score -->
    <rect x="0" y="0" width="195" height="68" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.08)" />
    <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">DYNAMIC HEALTH SCORE</text>
    <text x="16" y="52" font-family="monospace" font-size="22" fill="#34d399" font-weight="800">96 / 100</text>
    <text x="122" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#10b981">Excellent</text>

    <!-- Metric 2: Gadget Passports -->
    <rect x="210" y="0" width="205" height="68" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.08)" />
    <text x="226" y="26" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">DIGITAL PASSPORT™</text>
    <text x="226" y="52" font-family="monospace" font-size="22" fill="#38bdf8" font-weight="800">QR + PDF</text>
    <text x="330" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">FPDF Engine</text>

    <!-- Metric 3: Database & RBAC -->
    <rect x="430" y="0" width="200" height="68" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.08)" />
    <text x="446" y="26" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">DATABASE SCHEMA</text>
    <text x="446" y="52" font-family="monospace" font-size="22" fill="#a855f7" font-weight="800">14 Tables</text>
    <text x="548" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">MySQL</text>
  </g>

  <!-- Tags Footer -->
  <g transform="translate(85, 300)">
    <rect x="0" y="0" width="105" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.35)" />
    <text x="14" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#6ee7b7" font-weight="600">PHP 8.2 (OOP)</text>

    <rect x="115" y="0" width="115" height="24" rx="12" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="129" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#7dd3fc" font-weight="600">MySQL Schema</text>

    <rect x="240" y="0" width="105" height="24" rx="12" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.35)" />
    <text x="254" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#a5b4fc" font-weight="600">FPDF Engine</text>

    <rect x="355" y="0" width="135" height="24" rx="12" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.35)" />
    <text x="369" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#d8b4fe" font-weight="600">WDV Depreciation</text>

    <rect x="500" y="0" width="135" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.35)" />
    <text x="514" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#6ee7b7" font-weight="600">Green Pulse ESG</text>
