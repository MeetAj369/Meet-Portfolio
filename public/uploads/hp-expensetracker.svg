<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradient)" rx="16" />
  
  <!-- Subtle decorative grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Header / Navigation Bar Mock -->
  <rect x="40" y="30" width="720" height="54" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" filter="url(#shadow)" />
  <circle cx="70" cy="57" r="14" fill="url(#primaryGlow)" />
  <text x="64" y="62" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">₹</text>
  <text x="96" y="62" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" font-weight="bold">HP <tspan fill="#818cf8">Expense Tracker</tspan></text>
  <rect x="250" y="47" width="70" height="20" rx="10" fill="#312e81" />
  <text x="262" y="61" font-family="-apple-system, sans-serif" font-size="10" fill="#a5b4fc" font-weight="600">LIVE v2.4</text>

  <rect x="620" y="44" width="120" height="26" rx="6" fill="#4f46e5" />
  <text x="635" y="61" font-family="-apple-system, sans-serif" font-size="11" fill="#ffffff" font-weight="600">+ Add Expense</text>

  <!-- 4 KPI Cards -->
  <!-- 1: Total Balance -->
  <rect x="40" y="105" width="168" height="95" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
  <line x1="40" y1="105" x2="208" y2="105" stroke="#4f46e5" stroke-width="3" />
  <text x="54" y="127" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af" font-weight="600">NET BALANCE</text>
  <text x="54" y="158" font-family="monospace" font-size="20" fill="#818cf8" font-weight="bold">₹1,48,250</text>
  <text x="54" y="185" font-family="-apple-system, sans-serif" font-size="10" fill="#10b981">▲ +14.2% vs last mo</text>

  <!-- 2: Total Income -->
  <rect x="224" y="105" width="168" height="95" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
  <line x1="224" y1="105" x2="392" y2="105" stroke="#10b981" stroke-width="3" />
  <text x="238" y="127" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af" font-weight="600">TOTAL INFLOW</text>
  <text x="238" y="158" font-family="monospace" font-size="20" fill="#34d399" font-weight="bold">₹85,000</text>
  <text x="238" y="185" font-family="-apple-system, sans-serif" font-size="10" fill="#9ca3af">Salary &amp; Consulting</text>

  <!-- 3: Total Spent -->
  <rect x="408" y="105" width="168" height="95" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
  <line x1="408" y1="105" x2="576" y2="105" stroke="#ef4444" stroke-width="3" />
  <text x="422" y="127" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af" font-weight="600">TOTAL SPENT</text>
  <text x="422" y="158" font-family="monospace" font-size="20" fill="#f87171" font-weight="bold">₹32,450</text>
  <text x="422" y="185" font-family="-apple-system, sans-serif" font-size="10" fill="#34d399">✓ ₹7,550 Under budget</text>

  <!-- 4: Savings Rate -->
  <rect x="592" y="105" width="168" height="95" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
  <line x1="592" y1="105" x2="760" y2="105" stroke="#06b6d4" stroke-width="3" />
  <text x="606" y="127" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af" font-weight="600">SAVINGS RATE</text>
  <text x="606" y="158" font-family="monospace" font-size="20" fill="#22d3ee" font-weight="bold">61.8%</text>
  <text x="606" y="185" font-family="-apple-system, sans-serif" font-size="10" fill="#22d3ee">Target 50% Exceeded</text>

  <!-- Cashflow Trend Card (Left Bottom) -->
  <rect x="40" y="218" width="450" height="252" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
  <text x="60" y="246" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">6-Month Cashflow Analytics</text>
  <text x="60" y="264" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af">Monthly Inflow vs Outflow vs Net Surplus</text>

  <!-- Bar Charts -->
  <!-- May -->
  <rect x="75" y="330" width="18" height="90" rx="3" fill="#10b981" opacity="0.85" />
  <rect x="97" y="375" width="18" height="45" rx="3" fill="#ef4444" opacity="0.85" />
  <text x="86" y="438" font-family="-apple-system, sans-serif" font-size="10" fill="#9ca3af">MAY</text>

  <!-- Jun -->
  <rect x="140" y="320" width="18" height="100" rx="3" fill="#10b981" opacity="0.85" />
  <rect x="162" y="370" width="18" height="50" rx="3" fill="#ef4444" opacity="0.85" />
  <text x="151" y="438" font-family="-apple-system, sans-serif" font-size="10" fill="#9ca3af">JUN</text>

  <!-- Jul -->
  <rect x="205" y="320" width="18" height="100" rx="3" fill="#10b981" opacity="0.85" />
  <rect x="227" y="372" width="18" height="48" rx="3" fill="#ef4444" opacity="0.85" />
  <text x="216" y="438" font-family="-apple-system, sans-serif" font-size="10" fill="#9ca3af">JUL</text>

  <!-- Aug -->
  <rect x="270" y="310" width="18" height="110" rx="3" fill="#10b981" opacity="0.85" />
  <rect x="292" y="365" width="18" height="55" rx="3" fill="#ef4444" opacity="0.85" />
  <text x="281" y="438" font-family="-apple-system, sans-serif" font-size="10" fill="#9ca3af">AUG</text>

  <!-- Sep -->
  <rect x="335" y="305" width="18" height="115" rx="3" fill="#10b981" opacity="0.85" />
  <rect x="357" y="370" width="18" height="50" rx="3" fill="#ef4444" opacity="0.85" />
  <text x="346" y="438" font-family="-apple-system, sans-serif" font-size="10" fill="#9ca3af">SEP</text>

  <!-- Oct -->
  <rect x="400" y="295" width="18" height="125" rx="3" fill="#10b981" />
  <rect x="422" y="365" width="18" height="55" rx="3" fill="#ef4444" />
  <text x="411" y="438" font-family="-apple-system, sans-serif" font-size="10" fill="#34d399" font-weight="bold">OCT</text>

  <!-- Donut Chart & Budgets (Right Bottom) -->
  <rect x="506" y="218" width="254" height="252" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
  <text x="526" y="246" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Budget Intelligence</text>
  <text x="526" y="264" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af">Category Limits &amp; Consumption</text>

  <!-- Budget bars -->
  <!-- Food -->
  <text x="526" y="296" font-family="-apple-system, sans-serif" font-size="11" fill="#ffffff">🍔 Food &amp; Dining (76%)</text>
  <rect x="526" y="304" width="214" height="6" rx="3" fill="#374151" />
  <rect x="526" y="304" width="163" height="6" rx="3" fill="#f59e0b" />

  <!-- Rent -->
  <text x="526" y="334" font-family="-apple-system, sans-serif" font-size="11" fill="#ffffff">🏠 Rent &amp; Housing (95%)</text>
  <rect x="526" y="342" width="214" height="6" rx="3" fill="#374151" />
  <rect x="526" y="342" width="205" height="6" rx="3" fill="#ef4444" />

  <!-- Gadgets & Tools -->
  <text x="526" y="372" font-family="-apple-system, sans-serif" font-size="11" fill="#ffffff">💻 Gadgets &amp; Tools (61%)</text>
  <rect x="526" y="380" width="214" height="6" rx="3" fill="#374151" />
  <rect x="526" y="380" width="131" height="6" rx="3" fill="#10b981" />

  <!-- Transport -->
  <text x="526" y="410" font-family="-apple-system, sans-serif" font-size="11" fill="#ffffff">🚗 Transport &amp; Fuel (64%)</text>
  <rect x="526" y="418" width="214" height="6" rx="3" fill="#374151" />
  <rect x="526" y="418" width="137" height="6" rx="3" fill="#06b6d4" />

  <!-- Badge / Signature at bottom -->
  <rect x="526" y="440" width="214" height="20" rx="4" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
  <text x="548" y="454" font-family="-apple-system, sans-serif" font-size="9" fill="#a5b4fc" font-weight="bold">11 RELATIONAL TABLES · C ENGINE</text>
</svg>