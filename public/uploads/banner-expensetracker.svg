<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <radialGradient id="glowEt" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGradEt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadowEt" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bgEt)" />
  <rect width="800" height="420" fill="url(#glowEt)" />

  <!-- Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="800" y2="70" />
    <line x1="0" y1="140" x2="800" y2="140" />
    <line x1="0" y1="210" x2="800" y2="210" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="160" y1="0" x2="160" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="640" y1="0" x2="640" y2="420" />
  </g>

  <!-- Top Window Header Mock -->
  <rect x="40" y="24" width="720" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
  <circle cx="62" cy="42" r="5" fill="#ef4444" />
  <circle cx="78" cy="42" r="5" fill="#f59e0b" />
  <circle cx="94" cy="42" r="5" fill="#10b981" />
  <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">dashboard.php — Financial Ledger Analytics &amp; C Calculation Engine</text>

  <!-- Live Platform Pill Badge -->
  <rect x="560" y="30" width="188" height="24" rx="12" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.6)" />
  <circle cx="575" cy="42" r="4" fill="#10b981" />
  <text x="586" y="46" font-family="-apple-system, sans-serif" font-size="10.5" fill="#34d399" font-weight="700">● LIVE WORKING APP</text>

  <!-- Main Hero Card -->
  <g filter="url(#shadowEt)">
    <rect x="50" y="80" width="700" height="290" rx="16" fill="rgba(6, 30, 24, 0.8)" stroke="rgba(45, 212, 191, 0.35)" stroke-width="1.2" />
    <rect x="50" y="80" width="700" height="2" fill="url(#textGradEt)" />
  </g>

  <!-- Brand Identity -->
  <g transform="translate(85, 115)">
    <!-- Wallet / Coin Icon Emblem -->
    <rect x="0" y="0" width="60" height="60" rx="14" fill="rgba(45, 212, 191, 0.15)" stroke="rgba(45, 212, 191, 0.45)" stroke-width="1.5" />
    <rect x="14" y="20" width="32" height="22" rx="4" fill="none" stroke="#2dd4bf" stroke-width="2.2" />
    <circle cx="34" cy="31" r="3" fill="#34d399" />
    <path d="M18 20 V16 C18 14 20 12 22 12 H38 C40 12 42 14 42 16 V20" fill="none" stroke="#5eead4" stroke-width="2" />

    <!-- Title and Subtitle -->
    <text x="76" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="url(#textGradEt)" letter-spacing="-0.5">HP Expense Tracker</text>
    <text x="76" y="52" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">Financial Intelligence, Dynamic Budgeting &amp; Ledger Platform</text>
  </g>

  <!-- Key Metrics Grid -->
  <g transform="translate(85, 205)">
    <!-- Metric 1: Net Balance -->
    <rect x="0" y="0" width="200" height="68" rx="10" fill="rgba(15, 45, 36, 0.75)" stroke="rgba(255,255,255,0.08)" />
    <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">NET LIQUID BALANCE</text>
    <text x="16" y="52" font-family="monospace" font-size="22" fill="#34d399" font-weight="800">₹1,48,250</text>
    <text x="145" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#10b981">+14.2%</text>

    <!-- Metric 2: 11 Relational Tables -->
    <rect x="215" y="0" width="205" height="68" rx="10" fill="rgba(15, 45, 36, 0.75)" stroke="rgba(255,255,255,0.08)" />
    <text x="231" y="26" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">RELATIONAL SCHEMA</text>
    <text x="231" y="52" font-family="monospace" font-size="22" fill="#2dd4bf" font-weight="800">11 Tables</text>
    <text x="345" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">MySQL</text>

    <!-- Metric 3: Compiled C Engine -->
    <rect x="435" y="0" width="195" height="68" rx="10" fill="rgba(15, 45, 36, 0.75)" stroke="rgba(255,255,255,0.08)" />
    <text x="451" y="26" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">CALCULATION ENGINE</text>
    <text x="451" y="52" font-family="monospace" font-size="22" fill="#38bdf8" font-weight="800">C Engine</text>
    <text x="552" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">calc.c</text>
  </g>

  <!-- Tags Footer -->
  <g transform="translate(85, 300)">
    <rect x="0" y="0" width="105" height="24" rx="12" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.35)" />
    <text x="14" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#6ee7b7" font-weight="600">PHP 8.2 (PDO)</text>

    <rect x="115" y="0" width="115" height="24" rx="12" fill="rgba(45, 212, 191, 0.15)" stroke="rgba(45, 212, 191, 0.35)" />
    <text x="129" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#5eead4" font-weight="600">MySQL Schema</text>

    <rect x="240" y="0" width="125" height="24" rx="12" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)" />
    <text x="254" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#7dd3fc" font-weight="600">Chart.js Analytics</text>

    <rect x="375" y="0" width="125" height="24" rx="12" fill="rgba(167, 139, 250, 0.15)" stroke="rgba(167, 139, 250, 0.35)" />
    <text x="389" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#c4b5fd" font-weight="600">Budget Limits</text>

    <rect x="510" y="0" width="115" height="24" rx="12" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.35)" />
    <text x="524" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#6ee7b7" font-weight="600">CSV Export</text>
  </g>
</svg>