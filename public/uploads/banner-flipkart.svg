<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <radialGradient id="glowFk" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2874f0" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGradFk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe500" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadowFk" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bgFk)" />
  <rect width="800" height="420" fill="url(#glowFk)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="800" y2="70" />
    <line x1="0" y1="140" x2="800" y2="140" />
    <line x1="0" y1="210" x2="800" y2="210" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="160" y1="0" x2="160" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="640" y1="0" x2="640" y2="420" />
  </g>

  <!-- Top Status Bar -->
  <rect x="40" y="24" width="720" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
  <circle cx="62" cy="42" r="5" fill="#ef4444" />
  <circle cx="78" cy="42" r="5" fill="#ffe500" />
  <circle cx="94" cy="42" r="5" fill="#10b981" />
  <text x="120" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">server.js — Flipkart E-Commerce REST Microservices</text>

  <!-- Badge top-right -->
  <rect x="580" y="30" width="168" height="24" rx="12" fill="rgba(40, 116, 240, 0.3)" stroke="rgba(40, 116, 240, 0.7)" />
  <text x="596" y="46" font-family="-apple-system, sans-serif" font-size="10.5" fill="#ffe500" font-weight="700">⚡ REST API PLAYGROUND</text>

  <!-- Main Hero Card -->
  <g filter="url(#shadowFk)">
    <rect x="50" y="80" width="700" height="290" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(40, 116, 240, 0.4)" stroke-width="1.2" />
    <rect x="50" y="80" width="700" height="2" fill="url(#textGradFk)" />
  </g>

  <!-- Left Side: Brand Logo & Title -->
  <g transform="translate(85, 115)">
    <!-- Brand Icon Emblem -->
    <rect x="0" y="0" width="60" height="60" rx="14" fill="rgba(40, 116, 240, 0.2)" stroke="rgba(40, 116, 240, 0.6)" stroke-width="1.5" />
    <path d="M18 20 L42 20 L38 42 L22 42 Z" fill="none" stroke="#ffe500" stroke-width="2.5" />
    <circle cx="26" cy="46" r="2.5" fill="#ffe500" />
    <circle cx="34" cy="46" r="2.5" fill="#ffe500" />

    <!-- Title & Subtitle -->
    <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#ffffff" font-weight="800" letter-spacing="-0.5">Flipkart E-Commerce REST API</text>
    <text x="80" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Express.js • JWT Authentication • Resilient In-Memory Fallback • Orders Engine</text>
  </g>

  <!-- Highlights Pills -->
  <g transform="translate(85, 200)">
    <rect x="0" y="0" width="130" height="30" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="16" y="19" font-family="-apple-system, sans-serif" font-size="11.5" fill="#60a5fa" font-weight="700">NODE &amp; EXPRESS</text>

    <rect x="142" y="0" width="140" height="30" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="156" y="19" font-family="-apple-system, sans-serif" font-size="11.5" fill="#ffe500" font-weight="700">JWT AUTH</text>

    <rect x="294" y="0" width="170" height="30" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="306" y="19" font-family="-apple-system, sans-serif" font-size="11.5" fill="#34d399" font-weight="700">MONGODB ATLAS</text>

    <rect x="476" y="0" width="150" height="30" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="490" y="19" font-family="-apple-system, sans-serif" font-size="11.5" fill="#f472b6" font-weight="700">ORDER TRACKING</text>
  </g>

  <!-- API Endpoints Interactive Preview -->
  <g transform="translate(85, 252)">
    <!-- Route 1 -->
    <rect x="0" y="0" width="305" height="38" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" />
    <rect x="10" y="9" width="38" height="20" rx="3" fill="#0284c7" />
    <text x="16" y="23" font-family="monospace" font-size="10" fill="#fff" font-weight="bold">GET</text>
    <text x="56" y="24" font-family="monospace" font-size="12" fill="#38bdf8">/products?category=Mobiles</text>
    <text x="260" y="24" font-family="-apple-system, sans-serif" font-size="10.5" fill="#10b981" font-weight="bold">200 OK</text>

    <!-- Route 2 -->
    <rect x="325" y="0" width="305" height="38" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" />
    <rect x="335" y="9" width="44" height="20" rx="3" fill="#16a34a" />
    <text x="340" y="23" font-family="monospace" font-size="10" fill="#fff" font-weight="bold">POST</text>
    <text x="388" y="24" font-family="monospace" font-size="12" fill="#38bdf8">/auth/login</text>
    <text x="575" y="24" font-family="-apple-system, sans-serif" font-size="10.5" fill="#10b981" font-weight="bold">JWT TOKEN</text>

    <!-- Route 3 -->
    <rect x="0" y="47" width="305" height="38" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" />
    <rect x="10" y="56" width="44" height="20" rx="3" fill="#16a34a" />
    <text x="15" y="70" font-family="monospace" font-size="10" fill="#fff" font-weight="bold">POST</text>
    <text x="62" y="71" font-family="monospace" font-size="12" fill="#38bdf8">/cart/add</text>
    <text x="250" y="71" font-family="-apple-system, sans-serif" font-size="10.5" fill="#10b981" font-weight="bold">QTY SYNC</text>

    <!-- Route 4 -->
    <rect x="325" y="47" width="305" height="38" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" />
    <rect x="335" y="56" width="44" height="20" rx="3" fill="#16a34a" />
    <text x="340" y="70" font-family="monospace" font-size="10" fill="#fff" font-weight="bold">POST</text>
    <text x="388" y="71" font-family="monospace" font-size="12" fill="#38bdf8">/orders (Checkout)</text>
    <text x="560" y="71" font-family="-apple-system, sans-serif" font-size="10.5" fill="#ffe500" font-weight="bold">FKRT TRACK</text>
  </g>
</svg>
